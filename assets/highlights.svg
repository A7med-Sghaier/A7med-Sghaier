<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="132" viewBox="0 0 1000 132" role="img" aria-label="Impact at a glance">
  <defs>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#141c2b"/>
      <stop offset="1" stop-color="#0f1621"/>
    </linearGradient>
    <linearGradient id="acc" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2dd4bf"/>
      <stop offset="1" stop-color="#38bdf8"/>
    </linearGradient>
    <style>
      .big { font-family:'Segoe UI',Helvetica,Arial,sans-serif; font-weight:700; }
      .lbl { font-family:'Segoe UI',Helvetica,Arial,sans-serif; font-weight:500; }
      .kick{ font-family:'Segoe UI',Helvetica,Arial,sans-serif; font-weight:600; letter-spacing:2px; }
    </style>
  </defs>

  <text x="14" y="18" class="kick" font-size="12" fill="#38bdf8">IMPACT AT A GLANCE</text>

  <!-- card 1 -->
  <g transform="translate(0,30)">
    <rect width="238" height="96" rx="12" fill="url(#card)" stroke="#233043"/>
    <rect x="0" y="0" width="238" height="3" rx="2" fill="url(#acc)"/>
    <text x="119" y="52" text-anchor="middle" class="big" font-size="34" fill="#f0f6fc">8+ yrs</text>
    <text x="119" y="76" text-anchor="middle" class="lbl" font-size="13" fill="#8b98a9">full-stack experience</text>
  </g>

  <!-- card 2 -->
  <g transform="translate(254,30)">
    <rect width="238" height="96" rx="12" fill="url(#card)" stroke="#233043"/>
    <rect x="0" y="0" width="238" height="3" rx="2" fill="url(#acc)"/>
    <text x="119" y="52" text-anchor="middle" class="big" font-size="30" fill="#f0f6fc">2.5s &#8594; 700ms</text>
    <text x="119" y="76" text-anchor="middle" class="lbl" font-size="13" fill="#8b98a9">~3.5&#215; faster load time</text>
  </g>

  <!-- card 3 -->
  <g transform="translate(508,30)">
    <rect width="238" height="96" rx="12" fill="url(#card)" stroke="#233043"/>
    <rect x="0" y="0" width="238" height="3" rx="2" fill="url(#acc)"/>
    <text x="119" y="52" text-anchor="middle" class="big" font-size="34" fill="#f0f6fc">50GB+</text>
    <text x="119" y="76" text-anchor="middle" class="lbl" font-size="13" fill="#8b98a9">DB pipeline growth avoided</text>
  </g>

  <!-- card 4 -->
  <g transform="translate(762,30)">
    <rect width="238" height="96" rx="12" fill="url(#card)" stroke="#233043"/>
    <rect x="0" y="0" width="238" height="3" rx="2" fill="url(#acc)"/>
    <text x="119" y="50" text-anchor="middle" class="big" font-size="19" fill="#f0f6fc">BMW &#183; LBBW</text>
    <text x="119" y="72" text-anchor="middle" class="big" font-size="19" fill="#f0f6fc">bulwiengesa</text>
    <text x="119" y="90" text-anchor="middle" class="lbl" font-size="11.5" fill="#8b98a9">enterprise delivery</text>
  </g>
</svg>
